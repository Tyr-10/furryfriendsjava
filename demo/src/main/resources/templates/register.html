<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <style>
        .rol-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .rol-buttons button {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            background: #3498db;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .rol-buttons button.active {
            background: #4CAF50;
        }
        
        #form-container {
            max-width: 600px;
            margin: 0 auto;
            display: none;
        }
    </style>
</head>

<body>
    <a href="/" class="btn btn-secondary">🏠 Volver a inicio</a>
    <h1 style="text-align:center;">Registro</h1>
    <div class="rol-buttons">
        <button type="button" onclick="cargarFormulario('adoptante', this)">Adoptante</button>
        <button type="button" onclick="cargarFormulario('refugio_fisico', this)">Refugio Físico</button>
        <button type="button" onclick="cargarFormulario('natural', this)">Persona Natural</button>
    </div>
    <div id="form-container"></div>
    <script>
        function cargarFormulario(rol, btn) {
            document.querySelectorAll('.rol-buttons button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('form-container').style.display = 'block';
            fetch('/register/' + rol)
                .then(resp => resp.text())
                .then(html => {
                    document.getElementById('form-container').innerHTML = html;
                });
        }
    </script>
</body>

</html>
