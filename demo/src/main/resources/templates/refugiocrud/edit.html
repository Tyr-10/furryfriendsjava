<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Perro</title>
</head>
<body>
<h1>Editar Perro</h1>
<form th:action="@{/refugiocrud/actualizar}" method="post" enctype="multipart/form-data" th:object="${perro}">
    <input type="hidden" th:field="*{id}"/>

    <label>Nombre:</label>
    <input type="text" th:field="*{nombre}" required><br>

    <label>Edad:</label>
    <input type="number" th:field="*{edad}" required><br>

    <label>Tamaño:</label>
    <select th:field="*{tamanio}">
        <option th:each="t : ${tamanos}" th:value="${t}" th:text="${t}"></option>
    </select><br>

    <label>Color:</label>
    <input type="text" th:field="*{color}" required><br>

    <label>Sexo:</label>
    <select th:field="*{sexo}">
        <option th:each="s : ${sexos}" th:value="${s}" th:text="${s}"></option>
    </select><br>

    <label>Descripción:</label>
    <textarea th:field="*{descripcion}"></textarea><br>

    <label>Disponible:</label>
    <input type="checkbox" th:field="*{disponible}"><br>

    <label>Imagen (si deseas cambiarla):</label>
    <input type="file" name="imagenFile"><br>

    <button type="submit">Actualizar</button>
</form>
</body>
</html>
