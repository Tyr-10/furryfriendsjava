<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Listado de Perros</title>
    <link rel="stylesheet" th:href="@{/css/crudindex.css}">
    <link rel="stylesheet" th:href="@{/css/crudindex.perros.css}">
    <link rel="stylesheet" th:href="@{/css/crudbusqueda.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos amigables para la tabla */
        
        .tabla-perros {
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 32px #b3e5fc55;
            background: #fff;
            margin-top: 30px;
        }
        
        .tabla-perros th,
        .tabla-perros td {
            text-align: center;
            vertical-align: middle;
        }
        
        .tabla-perros th {
            background: linear-gradient(90deg, #42a5f5 0%, #81c784 100%);
            color: #fff;
            font-size: 1.08em;
            border-bottom: 4px solid #b3e5fc;
        }
        
        .tabla-perros tr:nth-child(even) td {
            background: #e3f2fd;
        }
        
        .tabla-perros tr:hover td {
            background: #b3e5fc44;
            transition: background 0.3s;
        }
        
        .tabla-perros td,
        .tabla-perros th {
            padding: 16px 10px;
        }
        
        .tabla-perros .acciones a {
            margin: 0 4px;
            font-size: 1em;
            padding: 7px 16px;
            border-radius: 20px;
            background: linear-gradient(90deg, #ffb703 0%, #42a5f5 100%);
            color: #fff !important;
            border: none;
            box-shadow: 0 2px 8px #b3e5fc55;
            transition: background 0.3s, transform 0.2s;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
        }
        
        .tabla-perros .acciones a:hover {
            background: linear-gradient(90deg, #42a5f5 0%, #ffb703 100%);
            color: #fff;
            transform: scale(1.08);
        }
        
        .tabla-perros th i {
            margin-right: 6px;
        }
        /* Estilos para el formulario de búsqueda */
        
        .busqueda-form {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .busqueda-form input[type="text"] {
            padding: 10px;
            border: 1px solid #42a5f5;
            border-radius: 20px 0 0 20px;
            outline: none;
            width: 300px;
            max-width: 100%;
        }
        
        .busqueda-form button.btn-buscar {
            padding: 10px 20px;
            border: none;
            border-radius: 0 20px 20px 0;
            background: linear-gradient(90deg, #ffb703 0%, #42a5f5 100%);
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .busqueda-form button.btn-buscar:hover {
            background: linear-gradient(90deg, #42a5f5 0%, #ffb703 100%);
        }
        
        .busqueda-form a.btn-limpiar {
            margin-left: 10px;
            padding: 10px 20px;
            border: 1px solid #ffb703;
            border-radius: 20px;
            background: transparent;
            color: #ffb703;
            text-decoration: none;
            transition: background 0.3s, color 0.3s;
        }
        
        .busqueda-form a.btn-limpiar:hover {
            background: #ffb703;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="bubbles-bg">
        <div class="bubble bubble1"></div>
        <div class="bubble bubble2"></div>
        <div class="bubble bubble3"></div>
        <div class="bubble bubble4"></div>
        <div class="bubble bubble5"></div>
    </div>
    <a href="/tablasadmin" class="btn-volver" style="margin: 18px 0 0 18px; display: inline-block;">← Volver</a>
    <h1>Listado de Perros</h1>
    <form class="busqueda-form" th:action="@{/perroscrud}" method="get">
        <input type="text" name="nombre" placeholder="Buscar por nombre" th:value="${nombre}">
        <button type="submit" class="btn-buscar">Buscar</button>
        <a th:href="@{/perroscrud}" class="btn-limpiar">Limpiar</a>
    </form>
    <a th:href="@{/perroscrud/create}">➕ Registrar nuevo perro</a>

    <table class="tabla-perros" border="0">
        <thead>
            <tr>
                <th><i class="fas fa-dog"></i>Nombre</th>
                <th><i class="fas fa-birthday-cake"></i>Edad</th>
                <th><i class="fas fa-dna"></i>Raza</th>
                <th><i class="fas fa-ruler-vertical"></i>Tamaño</th>
                <th><i class="fas fa-venus-mars"></i>Sexo</th>
                <th><i class="fas fa-palette"></i>Color</th>
                <th><i class="fas fa-cogs"></i>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="perro : ${perros}">
                <td th:text="${perro.nombre}">Nombre</td>
                <td th:text="${perro.edad}">Edad</td>
                <td th:text="${perro.raza}">Raza</td>
                <td th:text="${perro.tamanio}">Tamaño</td>
                <td th:text="${perro.sexo}">Sexo</td>
                <td th:text="${perro.color}">Color</td>
                <td class="acciones">
                    <a th:href="@{/perroscrud/edit/{id}(id=${perro.id})}" title="Editar" class="btn-editar"><i class="fas fa-edit"></i></a>
                    <a th:href="@{/perroscrud/eliminar/{id}(id=${perro.id})}" onclick="return confirm('¿Eliminar este perro?')" title="Eliminar" class="btn-eliminar"><i class="fas fa-trash-alt"></i></a>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
