<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-4">
    <h1>Gestión de Usuarios</h1>

    <a th:href="@{/usuarios/create}" class="btn btn-primary mb-3">Agregar Usuario</a>
    <a href="#" onclick="event.preventDefault(); window.history.length > 1 ? history.back() : window.location='/'" class="btn btn-primary">⬅ Volver</a>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <table class="table table-bordered">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Ciudad</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}">1</td>
                <td th:text="${usuario.name}">Nombre</td>
                <td th:text="${usuario.email}">Email</td>
                <td th:text="${usuario.telefono}">Teléfono</td>
                <td th:text="${usuario.ciudad}">Ciudad</td>
                <td th:text="${usuario.role?.nombre ?: 'Sin rol'}">Rol</td>
                <td>
                    <a th:href="@{'/usuarios/edit/' + ${usuario.id}}" class="btn btn-warning btn-sm">Editar</a>

                    <form th:action="@{'/usuarios/delete/' + ${usuario.id}}" method="post" style="display:inline;">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Desactivar usuario?')">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
