<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro Adoptante</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <style>
        body {
            background-color: #f6fbff;
        }
        #form-container {
            max-width: 480px;
            margin: 40px auto 0 auto;
            padding: 32px 32px 24px 32px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.12);
        }
        h1 {
            margin-top: 32px;
            margin-bottom: 18px;
            font-size: 2rem;
            text-align: center;
            color: #3498db;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 2px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            padding: 12px;
            border: 1px solid #b7dfea;
            border-radius: 6px;
            font-size: 1rem;
            background: #f9fcff;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #3498db;
            outline: none;
        }
        button[type="submit"] {
            margin-top: 18px;
            padding: 13px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: background 0.3s;
        }
        button[type="submit"]:hover {
            background-color: #217dbb;
        }
        #errorMensaje {
            color: #d32f2f;
            margin-top: 2px;
            min-height: 22px;
            font-size: 1em;
            text-align: center;
        }
        @media (max-width: 600px) {
            #form-container {
                max-width: 98vw;
                padding: 18px 6vw 18px 6vw;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="btn btn-secondary">🏠 Volver a inicio</a>
    <h1>Registro</h1>
    <div th:replace="registerform :: rol-buttons('adoptante')"></div>
    <div id="form-container">
        <form th:action="@{/registro/adoptante}" th:object="${usuario}" method="post"
              onsubmit="return validarContrasena()">
            <input type="hidden" th:field="*{rol}" value="adoptante">

            <label>Nombre:</label>
            <input type="text" th:field="*{nombre}" required>

            <label>Apellido:</label>
            <input type="text" name="apellido" required>

            <label>Correo Electrónico:</label>
            <input type="email" th:field="*{correo}" required>

            <label>Contraseña:</label>
            <input type="password" id="password" th:field="*{password}" required
                   placeholder="Mínimo 8 caracteres, una mayúscula, un número y un símbolo">

            <label>Confirmar contraseña:</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" required>

            <div id="errorMensaje" th:text="${error}"></div>

            <button type="submit">Registrar</button>
        </form>
    </div>
    <script>
        function validarContrasena() {
            const password = document.getElementById("password").value;
            const confirm = document.getElementById("passwordConfirm").value;
            const errorDiv = document.getElementById("errorMensaje");

            const regex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&.,\-_;:]).{8,}$/;

            if (!regex.test(password)) {
                errorDiv.textContent = "La contraseña debe tener mínimo 8 caracteres, una mayúscula, un número y un símbolo.";
                return false;
            }

            if (password !== confirm) {
                errorDiv.textContent = "Las contraseñas no coinciden.";
                return false;
            }

            errorDiv.textContent = "";
            return true;
        }
    </script>
</body>
</html>
