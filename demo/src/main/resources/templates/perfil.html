<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="/css/perfil.css">
</head>
<body>

<div style="position: absolute; top: 20px; left: 20px;">
    <a href="javascript:history.back()" class="btn-volver">⬅ Volver</a>
</div>

<div class="profile-container">
    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-avatar"
                 th:text="${usuario.nombre != null ? usuario.nombre.substring(0,1).toUpperCase() : usuario.correo.substring(0,1).toUpperCase()}">
            </div>
            <h1 class="profile-name" th:text="${usuario.nombre}">Usuario</h1>
            <p class="profile-email"><strong>Email:</strong> <span th:text="${usuario.correo}">correo</span></p>
            <p class="profile-email" th:if="${usuario.telefono != null}"><strong>Teléfono:</strong> <span th:text="${usuario.telefono}"></span></p>
            <p class="profile-email" th:if="${usuario.direccion != null}"><strong>Dirección:</strong> <span th:text="${usuario.direccion}"></span></p>
        </div>

        <button id="editButton" class="btn btn-secondary">Editar</button>

        <form id="editForm" th:action="@{/perfil/actualizar}" method="post" th:object="${usuario}" style="display: none;">
            <div class="input-group">
                <label>Nombre:</label>
                <input type="text" name="nombre" th:value="${usuario.nombre}" required>
            </div>
            <div class="input-group">
                <label>Email:</label>
                <input type="email" name="correo" th:value="${usuario.correo}" required>
            </div>
            <div class="input-group">
                <label>Teléfono:</label>
                <input type="text" name="telefono" th:value="${usuario.telefono}">
            </div>
            <div class="input-group">
                <label>Dirección:</label>
                <input type="text" name="direccion" th:value="${usuario.direccion}">
            </div>
            <div class="input-group">
                <label>Contraseña (dejar vacío si no quieres cambiarla):</label>
                <input type="password" name="nuevaPassword">
            </div>
            <button type="submit" class="btn btn-success">Guardar cambios</button>
        </form>

        <form th:action="@{/perfil/eliminar}" method="post" onsubmit="return confirm('¿Estás seguro que deseas eliminar tu cuenta?');">
            <button type="submit" class="btn btn-danger">Eliminar Cuenta</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('editButton').addEventListener('click', function () {
        document.getElementById('editForm').style.display = 'block';
        this.style.display = 'none';
    });
</script>

</body>
</html>
