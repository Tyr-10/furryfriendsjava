<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Perros</title>
    <link rel="stylesheet" th:href="@{/css/perrosdisponibles.css}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
</head>

<body>
    <div class="huellas-bg">
    <img src="/images/paw.jpg" class="huella huella1" alt="huella">
    <img src="/images/paw.jpg" class="huella huella2" alt="huella">
    <img src="/images/paw.jpg" class="huella huella3" alt="huella">
    <img src="/images/paw.jpg" class="huella huella4" alt="huella">
    <img src="/images/paw.jpg" class="huella huella5" alt="huella">
    <img src="/images/paw.jpg" class="huella huella6" alt="huella">
    <img src="/images/paw.jpg" class="huella huella7" alt="huella">
    <img src="/images/paw.jpg" class="huella huella8" alt="huella">
</div>
    <div class="container">
        <a href="javascript:history.back()" class="btn-volver">⬅ Volver</a>

        <div class="logo-titulo">
            <img src="/images/logo.jpg" alt="logo" class="logo">
            <h2>Buscar Perros</h2>
        </div>

        <!-- Mensaje de éxito -->
        <div th:if="${mensajeExito}" class="alert alert-success" style="text-align:center; color:green; font-weight:bold;">
            <span th:text="${mensajeExito}"></span><br>
            <span th:if="${adoptanteNombre}">Nombre: <span th:text="${adoptanteNombre}"></span></span><br>
            <span th:if="${adoptanteCorreo}">Correo: <span th:text="${adoptanteCorreo}"></span></span>
        </div>
        <div th:if="${mensajeError}" class="alert alert-danger" style="text-align:center; color:red; font-weight:bold;">
            <span th:text="${mensajeError}"></span>
        </div>

        <form method="GET" th:action="@{/perrosdisponibles}" class="busqueda-form">
            <input type="number" name="edad" placeholder="Ingrese la edad">
            <input type="text" name="color" placeholder="Ingrese el color">
            <input type="text" name="tamanio" placeholder="Ingrese el tamaño">
            <input type="text" name="descripcion" placeholder="Ingrese una descripción">
            <button type="submit" class="btn-buscar">Buscar</button>
        </form>

        <div class="info-total">
            <p th:text="'Total de perros disponibles: ' + ${perros.size()}"></p>
        </div>

        <div class="perros-grid">
            <div class="card" th:each="perro : ${perros}">
                <img th:src="@{'/imagen/' + ${perro.id}}" alt="Foto del perro"/>

                <div class="card-body">
                    <h5 th:text="${perro.nombre}"></h5>
                    <p>
                        <strong>Raza:</strong> <span th:text="${perro.raza}"></span><br>
                        <strong>Edad:</strong> <span th:text="${perro.edad}"></span> años<br>
                        <strong>Color:</strong> <span th:text="${perro.color}"></span><br>
                        <strong>Tamaño:</strong> <span th:text="${perro.tamanio}"></span><br>
                        <strong>Descripción:</strong> <span th:text="${perro.descripcion}"></span><br>
                        <strong>Historial Clínico:</strong> <span th:text="${perro.historialClinico}"></span>
                       

                    </p>
                </div>

                <div class="card-footer">
                    <form th:action="@{/solicitud-adopcion}" method="post">
                        <input type="hidden" name="perroId" th:value="${perro.id}">
                        <button class="btn-adoptar">Solicitar Adopción</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
