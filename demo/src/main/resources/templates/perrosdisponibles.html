<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscar Perros</title>
    <link rel="stylesheet" th:href="@{/css/perrosdisponibles.css}">
</head>

<body class="fondo">

    <div class="contenedor">
        <a href="javascript:history.back()" class="volver">⬅ Volver</a>

        <div class="encabezado">
            <img src="/images/logo.jpg" alt="logo" class="logo">
            <h2>Buscar Perros</h2>
        </div>

        <form method="GET" th:action="@{/perrosdisponibles}" class="formulario">
            <input type="number" name="edad" placeholder="Edad" class="input">
            <input type="text" name="color" placeholder="Color" class="input">
            <input type="text" name="tamanio" placeholder="Tamaño" class="input">
            <input type="text" name="descripcion" placeholder="Descripción" class="input">
            <button type="submit" class="boton">Buscar</button>
        </form>

        <div class="total">
            <p th:text="'Total de perros disponibles: ' + ${perros.size()}"></p>
        </div>

        <div class="galeria">
            <div class="tarjeta" th:each="perro : ${perros}">
                <img th:src="@{'/imagen/' + ${perro.id}}" alt="Foto del perro" class="foto">

                <div class="contenido">
                    <h3 th:text="${perro.nombre}">Nombre</h3>
                    <p><strong>Raza:</strong> <span th:text="${perro.raza}"></span></p>
                    <p><strong>Edad:</strong> <span th:text="${perro.edad}"></span> años</p>
                    <p><strong>Color:</strong> <span th:text="${perro.color}"></span></p>
                    <p><strong>Tamaño:</strong> <span th:text="${perro.tamanio}"></span></p>
                    <p><strong>Descripción:</strong> <span th:text="${perro.descripcion}"></span></p>
                    <p><strong>Historial Clínico:</strong> <span th:text="${perro.historialClinico}"></span></p>
                </div>

                <form th:action="@{/solicitud-adopcion}" method="post">
                    <input type="hidden" name="perroId" th:value="${perro.id}">
                    <button class="boton adoptar">Solicitar Adopción</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
