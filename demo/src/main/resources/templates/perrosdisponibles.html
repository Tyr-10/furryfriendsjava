<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Buscar Perros</title>
    <link rel="stylesheet" th:href="@{/css/perrosdisponibles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body style="background: #e9f3ff;">

    <div class="container mt-5">
        <a href="javascript:history.back()" class="btn btn-warning mb-3">⬅ Volver</a>

        <div class="text-center mb-4">
            <img src="/images/logo.jpg" alt="logo" style="width: 80px;">
            <h2>Buscar Perros</h2>
        </div>

        <form method="GET" th:action="@{/perrosdisponibles}" class="row g-3">
            <div class="col-md-3">
                <input type="number" name="edad" class="form-control" placeholder="Ingrese la edad">
            </div>
            <div class="col-md-3">
                <input type="text" name="color" class="form-control" placeholder="Ingrese el color">
            </div>
            <div class="col-md-3">
                <input type="text" name="tamanio" class="form-control" placeholder="Ingrese el tamaño">
            </div>
            <div class="col-md-3">
                <input type="text" name="descripcion" class="form-control" placeholder="Ingrese una descripción">
            </div>
            <div class="col-12 text-center">
                <button type="submit" class="btn btn-warning px-4">Buscar</button>
            </div>
        </form>

        <div class="text-center mt-4 mb-2">
            <p th:text="'Total de perros disponibles: ' + ${perros.size()}"></p>
        </div>

        <div class="row">
            <div class="col-md-4 mb-4" th:each="perro : ${perros}">
                <div class="card h-100 shadow">
                    <img th:src="@{'/images/' + ${perro.imagenperro}}" class="card-img-top" th:alt="'Imagen de ' + ${perro.nombre}" style="height: 250px; object-fit: cover;">

                    <div class="card-body">
                        <h5 class="card-title text-capitalize" th:text="${perro.nombre}"></h5>
                        <p class="card-text">
                            <strong>Raza:</strong> <span th:text="${perro.raza}"></span><br>
                            <strong>Edad:</strong> <span th:text="${perro.edad}"></span> años<br>
                            <strong>Color:</strong> <span th:text="${perro.color}"></span><br>
                            <strong>Tamaño:</strong> <span th:text="${perro.tamanio}"></span><br>
                            <strong>Descripción:</strong> <span th:text="${perro.descripcion}"></span><br>
                            <strong>Historial Clínico:</strong> <span th:text="${perro.historialClinico}"></span>
                        </p>
                    </div>

                    <div class="card-footer text-center">
                        <form th:action="@{/solicitud-adopcion}" method="post">
                            <input type="hidden" name="perroId" th:value="${perro.id}">
                            <button class="btn btn-primary">Solicitar Adopción</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
