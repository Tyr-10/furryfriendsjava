<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Viabilidad de Estudio</title>
    <link rel="stylesheet" href="/css/viabilidadvista.css">
</head>

<body>
    <div class="header">
        <img src="/img/perro-header.png" alt="logo" class="logo">
        <h1>🐾 Subir y Buscar Viabilidad de Estudios 🐾</h1>
    </div>

    <div class="container">
        <a href="/" class="btn-volver">← Volver</a>

        <h2>📤 Subir Viabilidad</h2>
        <form method="post" enctype="multipart/form-data" th:action="@{/viabilidad/subir}">
            <input type="file" name="archivo" accept="application/pdf" required>
            <button type="submit">Subir Archivo</button>
        </form>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <h2>🔍 Buscar Viabilidad</h2>
        <form method="get" th:action="@{/viabilidad}">
            <input type="text" name="archivo" placeholder="Nombre del archivo">
            <button type="submit">Buscar</button>
            <a th:href="@{/viabilidad}">
                <button type="button" class="limpiar">Limpiar</button>
            </a>
        </form>

        <!-- Mostrar solo si hay búsqueda -->
        <div th:if="${#request.getParameter('archivo') != null and #request.getParameter('archivo') != ''}">
            <ul th:if="${viabilidades}">
                <li th:each="v : ${viabilidades}">
                    <span th:text="${v.nombreOriginal}"></span> |
                    <a th:href="@{${v.archivo}}" target="_blank">Ver</a>
                    <form th:action="@{/viabilidad/desactivar/{id}(id=${v.id})}" method="post" style="display:inline;">
                        <button type="submit">Desactivar</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>

    <footer>© 2025 Furry Friends | Todos los derechos reservados</footer>
</body>

</html>
