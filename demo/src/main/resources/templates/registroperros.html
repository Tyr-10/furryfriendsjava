<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Perros</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #f0f8ff;">
<div class="container mt-5">
    <div class="logo-container text-center">
        <img th:src="@{/imagenes/logo.jpg}" alt="logo" style="width: 100px; height: auto;">
    </div>

    <a href="/" onclick="event.preventDefault(); window.history.length > 1 ? history.back() : window.location='/'" class="btn btn-primary mt-2">⬅ Volver</a>

    <h2 class="mb-4 text-center" style="color: #0056b3;">🐶 Furry Friends 🐶</h2>
    <h1 class="text-center mb-4" style="color: #004080;">🐶 Registro de Perros 🐶</h1>

    <form th:action="@{/registro-perro}" method="post" enctype="multipart/form-data" class="p-4 shadow-lg rounded" style="background: #e3f2fd;" th:object="${perro}">
        <div class="mb-3">
            <label class="form-label">📛 Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">🎂 Edad</label>
            <input type="number" th:field="*{edad}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">📏 Tamaño</label>
            <select th:field="*{tamanio}" class="form-control" required>
                <option value="Pequeño">Pequeño</option>
                <option value="Mediano">Mediano</option>
                <option value="Grande">Grande</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">🎨 Color</label>
            <input type="text" th:field="*{color}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">🩺 Historial Clínico</label>
            <textarea th:field="*{historialClinico}" class="form-control" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">⚥ Sexo</label>
            <select th:field="*{sexo}" class="form-control" required>
                <option value="Macho">Macho</option>
                <option value="Hembra">Hembra</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">🏷 Raza</label>
            <input type="text" th:field="*{raza}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">🖼 Imagen</label>
            <input type="file" name="imagen" class="form-control" accept="image/*" required>
        </div>

        <div class="mb-3">
            <label class="form-label">📖 Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">📌 Disponible para adopción</label>
            <select th:field="*{disponible}" class="form-control" required>
                <option value="true">Sí</option>
                <option value="false">No</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">🐾 Registrar Perro 🐾</button>
    </form>
</div>
</body>
</html>
