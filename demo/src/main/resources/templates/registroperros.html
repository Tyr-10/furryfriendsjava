<div class="container">
    <div style="text-align: center;">
        <img th:src="@{/images/logo.jpg}" alt="logo" class="logo">
    </div>

    <!-- Botón Volver: redirige según el rol del usuario -->
    <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/vistaadmin}" class="btn-volver mb-3">
        <span class="volver-icon">
            <svg width="22" height="22" viewBox="0 0 22 22" style="vertical-align: middle;">
                <polyline points="15,4 7,11 15,18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        Volver
    </a>

    <a th:if="${#authorization.expression('hasRole(''REFUGIO'')')}" th:href="@{/vistarefugio}" class="btn-volver mb-3">
        <span class="volver-icon">
            <svg width="22" height="22" viewBox="0 0 22 22" style="vertical-align: middle;">
                <polyline points="15,4 7,11 15,18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        Volver
    </a>

    <!-- Fallback para otros usuarios: regresar a la página anterior -->
    <a th:if="${#authorization.expression('hasRole(''ADMIN'')') == false and #authorization.expression('hasRole(''REFUGIO'')') == false}" href="javascript:void(0);" onclick="window.history.back();" class="btn-volver btn-volver-topright mb-3">
        <span class="volver-icon">
            <svg width="22" height="22" viewBox="0 0 22 22" style="vertical-align: middle;">
                <polyline points="15,4 7,11 15,18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        Volver
    </a>

    <h2 class="mb-2 text-center titulo-principal">Furry Friends</h2>
    <h1 class="text-center titulo-secundario anim-registro">Registro de Perros</h1>

    <!-- Notificaciones flotantes -->
    <div id="successToast" th:if="${success}" class="toast-notify toast-success">
        <span class="toast-icon">
            <svg width="22" height="22" viewBox="0 0 22 22">
                <circle cx="11" cy="11" r="10" fill="#b9f6ca"/>
                <polyline points="6,12 10,16 16,7" fill="none" stroke="#388e3c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        <span th:text="${success}"></span>
    </div>
    <div id="errorToast" th:if="${error}" class="toast-notify toast-error">
        <span class="toast-icon">
            <svg width="22" height="22" viewBox="0 0 22 22">
                <circle cx="11" cy="11" r="10" fill="#b9f6ca"/>
                <line x1="7" y1="7" x2="15" y2="15" stroke="#388e3c" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="15" y1="7" x2="7" y2="15" stroke="#388e3c" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </span>
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/registroperros}" method="post" enctype="multipart/form-data" class="p-4 shadow-lg rounded">
        <div class="mb-3">
            <label class="form-label">📛 Nombre</label>
            <input type="text" name="nombre" class="form-control" th:value="${perro.nombre}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">🎂 Edad</label>
            <input type="number" name="edad" class="form-control" th:value="${perro.edad}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">📏 Tamaño</label>
            <select name="tamanio" class="form-control" required>
                <option value="Pequeño" th:selected="${perro.tamanio == 'Pequeño'}">Pequeño</option>
                <option value="Mediano" th:selected="${perro.tamanio == 'Mediano'}">Mediano</option>
                <option value="Grande" th:selected="${perro.tamanio == 'Grande'}">Grande</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">🎨 Color</label>
            <input type="text" name="color" class="form-control" th:value="${perro.color}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">🩺 Historial Clínico</label>
            <textarea name="historialClinico" class="form-control" th:text="${perro.historialClinico}" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">⚥ Sexo</label>
            <select name="sexo" class="form-control" required>
                <option value="Macho" th:selected="${perro.sexo == 'Macho'}">Macho</option>
                <option value="Hembra" th:selected="${perro.sexo == 'Hembra'}">Hembra</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">🏷 Raza</label>
            <input type="text" name="raza" class="form-control" th:value="${perro.raza}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">🖼 Imagen</label>
            <input type="file" name="imagenArchivo" class="form-control" accept="image/*" required>
        </div>

        <div class="mb-3">
            <label class="form-label">📖 Descripción</label>
            <textarea name="descripcion" class="form-control" th:text="${perro.descripcion}" required></textarea>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-registrar">Registrar Perro</button>
        </div>
    </form>
</div>

<script>
window.addEventListener('DOMContentLoaded', function() {
    function showToast(id) {
        var el = document.getElementById(id);
        if (el) {
            el.classList.add('show');
            setTimeout(function() {
                el.classList.remove('show');
            }, 3500);
        }
    }
    showToast('successToast');
    showToast('errorToast');
});
</script>
