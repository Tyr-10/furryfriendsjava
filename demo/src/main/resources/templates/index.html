<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furry Friends</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    
    <!-- Header -->
    <header>
        <div class="menu-toggle" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>

        <div class="logo-container">
            <img src="images/logo.jpg" alt="logo" class="logo">
            <h1>Furry Friends</h1>
        </div>

        <div class="header-buttons">
            <a th:href="@{/login}" class="btn btn-primary">Iniciar Sesión</a>
            <a th:href="@{/registro/adoptante}" class="btn btn-secondary"><i class="fas-fa-user-plus"></i>Registrarse</a>
        </div>
    </header>

    <!-- Menú lateral -->
    <nav class="side-menu" id="sideMenu">
        <a th:href="@{/estadisticas}"><i class="fas fa-chart-bar"></i> Estadísticas</a>
        <a th:href="@{/cuidados}"><i class="fas fa-cog"></i> Cuidados</a>
    </nav>
    <div th:if="${session.mensajeDesactivado}" id="mensajeAlerta" class="alert">
    <p th:text="${session.mensajeDesactivado}"></p>
</div>

<script>
    // Oculta el mensaje después de 5 segundos
    setTimeout(() => {
        const alerta = document.getElementById('mensajeAlerta');
        if (alerta) {
            alerta.style.display = 'none';
        }
    }, 5000);
</script>

    <!-- Carrusel -->
    <main>
        <div class="carousel-container">
            <div class="carousel-slide active">
                <img src="images/ppp.jpg" alt="a.jpg" class="carousel-image">
            </div>

            <div class="carousel-slide">
                <img src="images/cute.jpg" alt="cute.jpg 1" class="carousel-image">
            </div>

            <div class="carousel-slide">
                <img src="images/f.jpg" alt="retriver2.jpeg" class="carousel-image">
            </div>

            <div class="carousel-slide">
                <img src="images/chanda.jpg" alt="chanda.jpg" class="carousel-image">
            </div>

            <button class="carousel-control prev" onclick="moveSlide(-1)">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="carousel-control next" onclick="moveSlide(1)">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <div class="action-buttons">
            <a th:href="@{/perrosdisponibles}" class="btn btn-primary">
                <i class="fas fa-search"></i> Ver Perros en Adopción
            </a>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        function toggleMenu() {
            const menu = document.getElementById("sideMenu");
            menu.classList.toggle("menu-open");
            document.body.style.marginLeft = menu.classList.contains("menu-open") ? "250px" : "0";
        }

        let currentSlide = 0;
        const slides = document.querySelectorAll(".carousel-slide");

        function showSlide(n) {
            slides.forEach(slide => slide.classList.remove("active"));
            if (n >= slides.length) currentSlide = 0;
            if (n < 0) currentSlide = slides.length - 1;
            slides[currentSlide].classList.add("active");
        }

        function moveSlide(n) {
            currentSlide += n;
            showSlide(currentSlide);
        }

        document.addEventListener("DOMContentLoaded", () => {
            showSlide(0);
            setInterval(() => moveSlide(1), 5000);
        });
    </script>

    <script th:src="@{/js/carousel.js}"></script>
    <script th:src="@{/js/menu.js}"></script>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Furry Friends - Todos los derechos reservados.</p>
    </footer>
</body>
</html>
