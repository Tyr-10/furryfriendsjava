<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro Refugio Físico</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd 0%, #fff 100%);
            position: relative;
            min-height: 100vh;
        }
        .animated-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .paw-heart {
            position: absolute;
            color: #b3e5fc;
            font-size: 2.2rem;
            opacity: 0.18;
            animation: float 16s linear infinite;
        }
        .paw-heart:nth-child(1) { left: 10vw; top: 80vh; animation-delay: 0s; }
        .paw-heart:nth-child(2) { left: 30vw; top: 90vh; animation-delay: 2s; }
        .paw-heart:nth-child(3) { left: 60vw; top: 85vh; animation-delay: 4s; }
        .paw-heart:nth-child(4) { left: 80vw; top: 95vh; animation-delay: 6s; }
        .paw-heart:nth-child(5) { left: 50vw; top: 100vh; animation-delay: 8s; }
        @keyframes float {
            0% { transform: translateY(0) scale(1) rotate(0deg);}
            50% { opacity: 0.28; }
            100% { transform: translateY(-120vh) scale(1.2) rotate(360deg);}
        }
        footer {
            background: linear-gradient(135deg, #e3f2fd 0%, #b3e5fc 100%);
            color: #1976d2;
            border-radius: 0;
            box-shadow: 0 2px 24px #b3e5fc77;
            padding: 56px 0 24px 0;
            margin: 0;
            width: 100vw;
            left: 0;
            font-family: 'Poppins', Arial, sans-serif;
            position: relative;
            z-index: 10;
        }
        .footer-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 32px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .footer-section {
            flex: 1;
            min-width: 220px;
            margin-bottom: 10px;
        }
        .footer-section h4 {
            color: #1976d2;
            font-size: 1.35rem;
            margin-bottom: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            font-family: 'Poppins', Arial, sans-serif;
        }
        .footer-section ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .footer-section a {
            color: #388e3c;
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 600;
            font-size: 1.08em;
            font-family: 'Poppins', Arial, sans-serif;
        }
        .footer-section a:hover {
            color: #217dbb;
        }
        .social-icons {
            display: flex;
            gap: 16px;
            margin-top: 18px;
        }
        .social-icons a {
            color: #1976d2;
            font-size: 1.35rem;
            transition: color 0.2s;
        }
        .social-icons a:hover {
            color: #388e3c;
        }
        .footer-bottom {
            text-align: center;
            color: #555;
            font-size: 1em;
            margin-top: 32px;
            font-weight: 500;
            font-family: 'Poppins', Arial, sans-serif;
        }
        @media (max-width: 700px) {
            .footer-content { flex-direction: column; align-items: center; }
            footer { padding: 28px 0 10px 0; }
        }
        #form-container {
            max-width: 480px;
            margin: 40px auto 0 auto;
            padding: 32px 32px 24px 32px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.12);
        }
        h1 {
            margin-top: 32px;
            margin-bottom: 18px;
            font-size: 2rem;
            text-align: center;
            color: #3498db;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 2px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        textarea {
            padding: 12px;
            border: 1px solid #b7dfea;
            border-radius: 6px;
            font-size: 1rem;
            background: #f9fcff;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        button[type="submit"] {
            margin-top: 18px;
            padding: 13px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: background 0.3s;
        }
        button[type="submit"]:hover {
            background-color: #217dbb;
        }
        #errorMensaje {
            color: #d32f2f;
            margin-top: 2px;
            min-height: 22px;
            font-size: 1em;
            text-align: center;
        }
        @media (max-width: 600px) {
            #form-container {
                max-width: 98vw;
                padding: 18px 6vw 18px 6vw;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="paw-heart">❤🐾</div>
        <div class="paw-heart">❤🐾</div>
        <div class="paw-heart">❤🐾</div>
        <div class="paw-heart">❤🐾</div>
        <div class="paw-heart">❤🐾</div>
    </div>
    <a href="/" class="btn btn-secondary">🏠 Volver a inicio</a>
    <h1>Registro</h1>
    <div th:replace="registerform :: rol-buttons('refugio')"></div>
    <div id="form-container">
        <form th:action="@{/registro/refugio}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{rol}" value="refugio_fisico">
            <label>Nombre Completo:</label>
            <input type="text" th:field="*{nombre}" required>
            <label>Correo Electrónico:</label>
            <input type="email" th:field="*{correo}" id="correo" required>
            <label>Teléfono:</label>
            <input type="text" th:field="*{telefono}">
            <label>Dirección:</label>
            <input type="text" th:field="*{direccion}" required>
            <label>Ciudad:</label>
            <input type="text" th:field="*{ciudad}">
            <label>Capacidad:</label>
            <input type="number" th:field="*{capacidad}">
            <label>Horarios de Atención:</label>
            <input type="text" th:field="*{horarios}">
            <label>Responsable:</label>
            <input type="text" th:field="*{responsable}">
            <label>Servicios:</label>
            <textarea th:field="*{servicios}" rows="3"></textarea>

            <label>Contraseña:</label>
            <input type="password" id="password" th:field="*{password}" required
                   placeholder="Mínimo 8 caracteres, una mayúscula, un número y un símbolo">
            <label>Confirmar Contraseña:</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" required>
            <div id="errorMensaje" th:text="${error}"></div>
            <button type="submit">Registrar</button>
        </form>
    </div>
    <script>
        function validarContrasenaYCorreo() {
            const password = document.getElementById("password").value;
            const confirm = document.getElementById("passwordConfirm").value;
            const errorDiv = document.getElementById("errorMensaje");
            const correo = document.getElementById("correo").value;

            const regex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&.,\-_;:]).{8,}$/;

            if (!correo.includes(".com") && !correo.includes(".co")) {
                errorDiv.textContent = "El correo debe contener '.com' o '.co'.";
                return false;
            }

            if (!regex.test(password)) {
                errorDiv.textContent = "La contraseña debe tener mínimo 8 caracteres, una mayúscula, un número y un símbolo.";
                return false;
            }

            if (password !== confirm) {
                errorDiv.textContent = "Las contraseñas no coinciden.";
                return false;
            }

            errorDiv.textContent = "";
            return true;
        }
        document.querySelector('form').onsubmit = validarContrasenaYCorreo;
    </script>
    <div style="height: 60px;"></div>
    <footer style="background: linear-gradient(135deg, #e3f2fd 0%, #b3e5fc 100%); color: #1976d2; border-radius: 0; box-shadow: 0 2px 24px #b3e5fc77; padding: 56px 0 24px 0; margin: 0; width: 100vw; left: 0; font-family: 'Poppins', Arial, sans-serif; position: relative; z-index: 10;">
        <div class="footer-content" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px; max-width: 1200px; margin: 0 auto;">
            <div class="footer-section" style="flex: 1; min-width: 220px; margin-bottom: 10px;">
                <h4 style="color: #1976d2; font-size: 1.35rem; margin-bottom: 14px; font-weight: 800; letter-spacing: 1px; font-family: 'Poppins', Arial, sans-serif;">Furry Friends</h4>
                <p style="color: #333; font-size: 1.08em; font-weight: 500; font-family: 'Poppins', Arial, sans-serif;">Conectando corazones desde 2024</p>
                <div class="social-icons" style="display: flex; gap: 16px; margin-top: 18px;">
                    <a href="#" style="color: #1976d2; font-size: 1.35rem; transition: color 0.2s;"><i class="fab fa-facebook"></i></a>
                    <a href="#" style="color: #1976d2; font-size: 1.35rem; transition: color 0.2s;"><i class="fab fa-instagram"></i></a>
                    <a href="#" style="color: #1976d2; font-size: 1.35rem; transition: color 0.2s;"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
            <div class="footer-section" style="flex: 1; min-width: 220px; margin-bottom: 10px;">
                <h4 style="color: #1976d2; font-size: 1.2rem; margin-bottom: 14px; font-weight: 700; font-family: 'Poppins', Arial, sans-serif;">Enlaces rápidos</h4>
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li><a th:href="@{/perrosdisponibles}" style="color: #388e3c; font-weight: 600; font-size: 1.08em; text-decoration: none; transition: color 0.2s; font-family: 'Poppins', Arial, sans-serif;">Adoptar</a></li>
                    <li><a th:href="@{/cuidados}" style="color: #388e3c; font-weight: 600; font-size: 1.08em; text-decoration: none; transition: color 0.2s; font-family: 'Poppins', Arial, sans-serif;">Cuidados</a></li>
                </ul>
            </div>
            <div class="footer-section" style="flex: 1; min-width: 220px; margin-bottom: 10px;">
                <h4 style="color: #1976d2; font-size: 1.2rem; margin-bottom: 14px; font-weight: 700; font-family: 'Poppins', Arial, sans-serif;">Contacto</h4>
                <p style="color: #444; font-size: 1.08em; font-family: 'Poppins', Arial, sans-serif;"><i class="fas fa-envelope"></i> furryfriendsadopciones@gmail.com</p>
            </div>
        </div>
        <div class="footer-bottom" style="text-align: center; color: #555; font-size: 1em; margin-top: 32px; font-weight: 500; font-family: 'Poppins', Arial, sans-serif;">
            <p>&copy; 2024 Furry Friends - Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
