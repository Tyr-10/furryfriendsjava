<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Subir Seguimiento</title>
</head>
<body>
<h1>Subir Archivo de Seguimiento</h1>

<form th:action="@{/seguimientocrud/guardar}" method="post" enctype="multipart/form-data">
    <label>Nombre Original:
        <input type="text" name="nombreOriginal" required />
    </label><br>
    <label>Archivo:
        <input type="file" name="archivo" accept=".pdf" required />
    </label><br>
    <button type="submit">Subir</button>
</form>

<a th:href="@{/seguimientocrud}">🔙 Volver</a>
</body>
</html>
