<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Subir Seguimiento</title>
    <link rel="stylesheet" th:href="@{/css/crud.css}">
</head>
<body>

<h1>Subir Seguimiento de Visita</h1>

<form th:action="@{/seguimientocrud/guardar}" method="post" enctype="multipart/form-data">
    <label>Seleccionar Archivo:
        <input type="file" name="archivo" required />
    </label><br>

    <button type="submit">Guardar</button>
</form>

<a th:href="@{/seguimientocrud}">🔙 Volver</a>

</body>
</html>
