<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Seguimiento</title>
    <link rel="stylesheet" th:href="@{/css/crudedit.css}">
</head>
<body>
<a href="/tablasadmin" class="btn-volver" style="margin: 18px 0 0 18px; display: inline-block;">← Volver</a>
<div class="lines-bg">
  <div class="line line1"></div>
  <div class="line line2"></div>
  <div class="line line3"></div>
  <div class="line line4"></div>
</div>
    <h1>Editar archivo</h1>
    <form method="post" enctype="multipart/form-data" th:action="@{'/seguimientocrud/actualizar/' + ${seguimiento.id}}">
        <label>Nuevo archivo PDF:</label>
        <input type="file" name="archivo" accept="application/pdf" required />
        <button type="submit">Actualizar</button>
    </form>
    <a th:href="@{/seguimientocrud}">Volver</a>
</body>
</html>
