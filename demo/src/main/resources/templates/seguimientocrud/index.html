<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Seguimientos</title>
    <link rel="stylesheet" href="/css/crud.css">
</head>
<body>
    <h1>Seguimientos registrados</h1>
    <a th:href="@{/seguimientocrud/create}">Subir nuevo seguimiento</a>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Archivo</th>
                <th>Nombre original</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${seguimientos}">
                <td th:text="${s.id}"></td>
                <td><a th:href="${s.archivo}" target="_blank">Ver archivo</a></td>
                <td th:text="${s.nombreOriginal}"></td>
                <td>
    <a th:href="@{'/seguimientocrud/edit/' + ${s.id}}">Editar</a>

    <form th:action="@{'/seguimientocrud/eliminar/' + ${s.id}}" method="post" style="display:inline;">
        <input type="hidden" name="_method" value="delete" />
        <button type="submit" onclick="return confirm('¿Estás seguro de eliminar este seguimiento?')">Eliminar</button>
    </form>
</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
