<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seguimiento de Visitas</title>
    <link rel="stylesheet" href="/css/seguimiento.css">
</head>

<body>
    <div class="container">
        <a href="#" onclick="history.back();" class="btn btn-primary" style="margin-top: 20px;">←Volver</a>

        <div class="header">
            <img src="/images/logo.jpg" alt="logo" class="logo">
            <h2>Subir Seguimiento de Visitas</h2>
        </div>

        <form method="post" enctype="multipart/form-data" th:action="@{/seguimiento/subir}" class="upload-form">
            <label for="archivo">Seleccionar Archivo</label>
            <input type="file" name="archivo" id="archivo" accept="application/pdf" required>
            <button type="submit">Subir Archivo</button>
        </form>

        <!-- Mensajes -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="search-section">
            <h2>Buscar Seguimientos</h2>
            <form method="get" th:action="@{/seguimiento}">
                <label for="buscar">Nombre del archivo</label>
                <input type="text" name="archivo" id="buscar" placeholder="Buscar...">
                <button type="submit">🔍 Buscar</button>
                <a th:href="@{/seguimiento}">
                    <button type="button">❌ Limpiar</button>
                </a>
            </form>
        </div>

        <!-- Mostrar resultados solo si hay búsqueda -->
        <div th:if="${seguimientos != null and !seguimientos.isEmpty()}">
            <ul>
                <li th:each="s : ${seguimientos}">
                    <span th:text="${s.nombreOriginal}"></span> |
                    <a th:if="${s.archivo != null}" th:href="@{${s.archivo}}" target="_blank">Ver</a>
                </li>
            </ul>
        </div>

        <!-- Mensaje si no se encontraron resultados -->
        <div th:if="${seguimientos != null and seguimientos.isEmpty()}">
            <p style="color: gray; margin-top: 20px;">😢 No se encontraron resultados.</p>
        </div>
    </div>

    <footer style="text-align: center; padding: 15px; background-color: #000000; color: white; margin-top: 50px;">
        © 2025 Sistema de Adopciones | Todos los derechos reservados
    </footer>
</body>
</html>
