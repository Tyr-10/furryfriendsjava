<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Usuarios - Lista</title>
    <link rel="stylesheet" th:href="@{/css/crudindex.css}">
    <link rel="stylesheet" th:href="@{/css/crudindex.usuarios.css}">
    <link rel="stylesheet" th:href="@{/css/crudbusqueda.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tabla-usuarios {
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 32px #b3e5fc55;
            background: #fff;
            margin-top: 30px;
        }
        
        .tabla-usuarios th,
        .tabla-usuarios td {
            text-align: center;
            vertical-align: middle;
        }
        
        .tabla-usuarios th {
            background: linear-gradient(90deg, #42a5f5 0%, #81c784 100%);
            color: #fff;
            font-size: 1.08em;
            border-bottom: 4px solid #b3e5fc;
        }
        
        .tabla-usuarios tr:nth-child(even) td {
            background: #e3f2fd;
        }
        
        .tabla-usuarios tr:hover td {
            background: #b3e5fc44;
            transition: background 0.3s;
        }
        
        .tabla-usuarios td,
        .tabla-usuarios th {
            padding: 16px 10px;
        }
        
        .tabla-usuarios .acciones a {
            margin: 0 4px;
            font-size: 1em;
            padding: 7px 16px;
            border-radius: 20px;
            background: linear-gradient(90deg, #ffb703 0%, #42a5f5 100%);
            color: #fff !important;
            border: none;
            box-shadow: 0 2px 8px #b3e5fc55;
            transition: background 0.3s, transform 0.2s;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
        }
        
        .tabla-usuarios .acciones a:hover {
            background: linear-gradient(90deg, #42a5f5 0%, #ffb703 100%);
            color: #fff;
            transform: scale(1.08);
        }
        
        .tabla-usuarios th i {
            margin-right: 6px;
        }
        
        .busqueda-form {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .busqueda-form input {
            padding: 10px;
            margin: 0 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            width: 250px;
            max-width: 100%;
        }
        
        .busqueda-form button,
        .busqueda-form a {
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(90deg, #ffb703 0%, #42a5f5 100%);
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s, transform 0.2s;
        }
        
        .busqueda-form button:hover,
        .busqueda-form a:hover {
            background: linear-gradient(90deg, #42a5f5 0%, #ffb703 100%);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="bubbles-bg">
        <div class="bubble bubble1"></div>
        <div class="bubble bubble2"></div>
        <div class="bubble bubble3"></div>
        <div class="bubble bubble4"></div>
        <div class="bubble bubble5"></div>
    </div>
    <a href="/tablasadmin" class="btn-volver" style="margin: 18px 0 0 18px; display: inline-block;">← Volver</a>
    <h1>Listado de Usuarios</h1>
    <form class="busqueda-form" th:action="@{/usuarioscrud}" method="get">
        <input type="text" name="nombre" placeholder="Buscar por nombre" th:value="${nombre}">
        <input type="text" name="correo" placeholder="Buscar por correo" th:value="${correo}">
        <button type="submit" class="btn-buscar">Buscar</button>
        <a th:href="@{/usuarioscrud}" class="btn-limpiar">Limpiar</a>
    </form>
    <a th:href="@{/usuarioscrud/create}">➕ Crear nuevo usuario</a>
    <table class="tabla-usuarios" border="0">
        <thead>
            <tr>
                <th><i class="fas fa-user"></i>Nombre</th>
                <th><i class="fas fa-envelope"></i>Correo</th>
                <th><i class="fas fa-phone"></i>Teléfono</th>
                <th><i class="fas fa-city"></i>Ciudad</th>
                <th><i class="fas fa-user-tag"></i>Rol</th>
                <th><i class="fas fa-cogs"></i>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.nombre}">Nombre</td>
                <td th:text="${usuario.correo}">Correo</td>
                <td th:text="${usuario.telefono}">Teléfono</td>
                <td th:text="${usuario.ciudad}">Ciudad</td>
                <td th:text="${usuario.rol != null ? usuario.rol.nombre : 'Sin rol'}">Rol</td>
                <td class="acciones">
                    <a th:href="@{/usuarioscrud/edit/{id}(id=${usuario.id})}" title="Editar" class="btn-editar"><i class="fas fa-edit"></i></a>
                    <a th:href="@{/usuarioscrud/eliminar/{id}(id=${usuario.id})}" onclick="return confirm('¿Seguro que deseas eliminar este usuario?')" title="Eliminar" class="btn-eliminar"><i class="fas fa-trash-alt"></i></a>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
