<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Lista</title>
    <link rel="stylesheet" th:href="@{/css/crud.css}">
</head>
<body>
<h1>Listado de Usuarios</h1>
<a th:href="@{/usuarioscrud/create}">➕ Crear nuevo usuario</a>
<table border="1">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Ciudad</th>
            <th>Rol</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.nombre}">Nombre</td>
            <td th:text="${usuario.correo}">Correo</td>
            <td th:text="${usuario.telefono}">Teléfono</td>
            <td th:text="${usuario.ciudad}">Ciudad</td>
            <td th:text="${usuario.rol != null ? usuario.rol.nombre : 'Sin rol'}">Rol</td>
            <td>
                
                <a th:href="@{/usuarioscrud/edit/{id}(id=${usuario.id})}">✏ Editar</a>
                <a th:href="@{/usuarioscrud/eliminar/{id}(id=${usuario.id})}" onclick="return confirm('¿Seguro que deseas eliminar este usuario?')">🗑 Eliminar</a>
            </td>
        </tr>
    </tbody>
</table>
</body>
</html>
